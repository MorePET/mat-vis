[package]
name = "mat-vis-client"
version = "0.6.0"
edition = "2021"
description = "mat-vis PBR texture client — per-file HF dataset (ADR-0012)"
license = "MIT"

[[bin]]
name = "mat-vis"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
httpmock = "0.8.3"
