[project]
name = "mat-vis-client"
version = "0.6.4"
description = "Pure Python client for mat-vis PBR textures — HTTP range reads, zero deps"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lars Gerchow" }]
keywords = ["materials", "pbr", "textures", "mat-vis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
# Enables glTF metallicRoughnessTexture packing in adapters.to_gltf().
# Without this extra, to_gltf() emits a `_note_no_pillow` placeholder
# when both metalness and roughness PNGs are present (it remains a
# zero-dependency client by default).
gltf = ["pillow>=10.0"]
# #359: opt-in fuzzy ranking for ``client.search(query=...)``. Without
# this extra, ``query=`` falls back to token-AND substring matching
# (functional but coarser ranking). rapidfuzz is a small compiled wheel
# (~250KB) — kept opt-in so the default install stays zero-dep.
search = ["rapidfuzz>=3.0"]
# Test-only deps. PyYAML loads the shared ``fixtures/expected_pbr.yaml``
# source-of-truth used by the Layer 3 / Layer 4 field-passthrough tests
# (mat-vis#382). Kept under an opt-in extra so the runtime install
# stays zero-dependency.
test = [
    "pytest>=7",
    "pyyaml>=6.0",
]

[project.scripts]
mat-vis-client = "mat_vis_client.client:main"

[project.urls]
Homepage = "https://github.com/MorePET/mat-vis"
Repository = "https://github.com/MorePET/mat-vis"
Issues = "https://github.com/MorePET/mat-vis/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mat_vis_client"]

# Local pytest config so that ``pytest`` from ``clients/python`` picks
# rootdir here and collects ``tests/`` (rather than walking up and
# inheriting the project-root ``testpaths`` which points at the
# top-level ``tests/`` dir). #274 — this matters once the Dagger
# ``test_client_python`` function dropped its explicit filename arg.
[tool.pytest.ini_options]
testpaths = ["tests"]
