[project]
name = "mat-vis"
version = "0.1.0"
description = "PBR texture mirror — baker + data pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
baker = [
    "pyarrow>=15",
    "requests>=2.31",
    "pillow>=10.0",
    "huggingface_hub>=0.25",
]
materialx = [
    "materialx>=1.39",
    "openexr>=3.3",
]
observability = [
    # OpenTelemetry for self-hosted dashboards (grafana/otel-lgtm,
    # Jaeger, Tempo). Opt-in via OTEL_EXPORTER_OTLP_ENDPOINT; no-op
    # when unset. Tailscale-exposed receivers work transparently.
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    # Editable install of the reference Python client so tests/ can
    # import `mat_vis_client` without a manual `pip install -e
    # clients/python`. Path-based source below — uv only resolves it
    # when the `dev` extra is requested. Workspace mode would have
    # made `clients/python` a mandatory member for every uv command,
    # which breaks Containerfile's `uv pip install .[baker]` (the
    # container only COPYs pyproject.toml + README + src/, not the
    # client tree).
    "mat-vis-client",
]

[project.scripts]
mat-vis-baker = "mat_vis_baker.__main__:main"

[tool.uv.sources]
# Path source resolved ONLY when the `dev` extra pulls mat-vis-client
# in. Container builds (which install just `.[baker]`) never look here.
mat-vis-client = { path = "clients/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mat_vis_baker"]

[tool.hatch.build.targets.wheel.force-include]
"src/mat_vis_baker/_spec/index-schema.json" = "mat_vis_baker/_spec/index-schema.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
