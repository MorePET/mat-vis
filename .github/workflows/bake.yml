---
# Bake workflow — atomic HF push per (source, tier) per ADR-0007.
#
# As of mat-vis#306: cells come from `mat_vis_baker.release_matrix`
# (the canonical source-of-truth for what a release line contains).
# This workflow no longer expands `sources=all` at dispatch time —
# instead it asks the matrix what cells the line declares, then runs
# one matrix sibling per cell.
#
# Reproduce locally:
#   uv run --with . mat-vis-baker matrix list v2026.04
#   dagger call bake --source=ambientcg --tier=1k --release-tag=v2026.04.3 ...
# Or in one shot:
#   dagger call bake-matrix --line=v2026.04 --release-tag=v2026.04.3 ...
#
# Each cell still runs as its own matrix sibling so the GH Actions UI
# preserves per-cell logs / status / re-run granularity.

name: Bake

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      line:
        description: >-
          Release line (CalVer prefix, e.g. "v2026.04"). Cells come
          from mat_vis_baker.release_matrix.get_release(line). Edit
          src/mat_vis_baker/release_matrix.py to change cell membership.
        required: true
        default: 'v2026.04'
        type: string
      release-tag:
        description: 'Calver patch tag (e.g. v2026.04.3) — must share the line prefix'
        required: true
        default: 'v2026.04.3'
        type: string
      filter-source:
        description: >-
          Restrict to one source (e.g. "gpuopen"). Empty = all cells in the line.
          Spot-test selector for partial re-bakes.
        required: false
        default: ''
        type: string
      filter-tier:
        description: >-
          Restrict to one tier (e.g. "1k", "scalar"). Empty = all tiers.
          Spot-test selector for partial re-bakes.
        required: false
        default: ''
        type: string
      limit:
        description: 'Per-cell max materials (0 = all)'
        required: false
        default: '0'
        type: string
      offset:
        description: 'Per-cell skip first N materials'
        required: false
        default: '0'
        type: string
      batch-size:
        description: 'Materials per atomic commit (count ceiling). #228: bytes is the binding constraint at typical content; 300 is a safe overshoot.'
        required: false
        default: '300'
        type: string
      batch-max-bytes:
        description: 'Bytes per atomic commit (#228). 734003200 = 700 MiB; HF caps at 1 GiB/commit, leaving headroom for catalog + manifest + sentinel.'
        required: false
        default: '734003200'
        type: string
      dry-run:
        description: 'Bake to local; skip the HF push'
        required: false
        default: false
        type: boolean
      repo-id:
        description: 'HF dataset repo'
        required: false
        default: 'gerchowl/mat-vis-tst'
        type: string
      allow-prod:
        description: 'Required to target any non-*-tst HF repo (e.g. gerchowl/mat-vis)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write          # needed by notify-on-failure composite action

# #262 / #278: disable Dagger's dagger.cloud OTel export at every layer.
# OTEL_SDK_DISABLED reaches the dagger CLI but the Go engine kept ID-generating
# (traceparent in error messages) → SIGPIPE on stdout collection. The four
# extra envs leave the engine no exporter target and no auth. Replace with
# self-hosted endpoint once #131 + #176 + the otlp-tailnet composite action
# are wired in.
env:
  OTEL_SDK_DISABLED: "true"
  DAGGER_NO_NAG: "1"
  DAGGER_CLOUD_TOKEN: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_TRACES_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"

# #235 hotfix: workflow-level budget — serialise *every* dispatch
# against a given HF repo. matrix.max-parallel below serializes WITHIN
# one dispatch; this serializes BETWEEN dispatches.
concurrency:
  group: bake-${{ inputs.repo-id }}-budget
  cancel-in-progress: false

jobs:
  plan:
    name: plan (read release matrix)
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: matrix
        env:
          LINE: ${{ inputs.line }}
          FILTER_SOURCE: ${{ inputs.filter-source }}
          FILTER_TIER: ${{ inputs.filter-tier }}
        # mat-vis#306: matrix expansion delegated to the canonical
        # source-of-truth (`mat_vis_baker.release_matrix`). The CLI
        # subcommand prints {"line": "...", "cells": [...]}; we keep
        # only the cells array for `fromJson(needs.plan.outputs.cells)`.
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${FILTER_SOURCE:-}" ]; then extra+=(--filter-source "$FILTER_SOURCE"); fi
          if [ -n "${FILTER_TIER:-}" ]; then extra+=(--filter-tier "$FILTER_TIER"); fi
          payload=$(uv run --with . mat-vis-baker matrix list "$LINE" "${extra[@]}")
          echo "matrix payload: $payload"
          cells=$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["cells"]))')
          if [ "$cells" = "[]" ]; then
            echo "::error::no cells matched line=$LINE filter-source=${FILTER_SOURCE:-} filter-tier=${FILTER_TIER:-}"
            exit 1
          fi
          echo "cells=$cells" >>"$GITHUB_OUTPUT"
          echo "Plan: $cells"

  bake:
    needs: plan
    name: hf-bake ${{ matrix.cell.source }} ${{ matrix.cell.tier }}
    runs-on: ubuntu-latest
    # GH-hosted runners hard-cap at 360 min; 350 leaves headroom for
    # the post-step log upload and any slack in the scheduler.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # #235 hotfix: serialise the matrix siblings WITHIN one dispatch
      # via matrix.max-parallel. Job-level concurrency-group serialization
      # doesn't work for matrix siblings — GH's "one pending slot per
      # group" rule cancels every sibling beyond the second within the
      # same run. matrix.max-parallel is the correct within-run primitive.
      max-parallel: 1
      matrix:
        cell: ${{ fromJson(needs.plan.outputs.cells) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # #295: content-drift gate needs git tag history for previous-tag resolution.
          # Schema-drift gate doesn't (it auto-discovers via GH API).
          fetch-depth: 0

      # `uv` is needed by the schema + content drift gates below; install
      # once up-front so the gates don't fail with `uv: command not found`
      # (latent since #170 — schema gate had never fired against a non-dry-run
      # bake until #214).
      - uses: astral-sh/setup-uv@v6

      - name: Dagger shell-safety lint (#61)
        run: python3 scripts/check-dagger-shell-safety.py

      - name: hf-bake
        # #297: dagger-call composite wraps with retry-on-141 + flake telemetry.
        uses: ./.github/actions/dagger-call
        with:
          args: >-
            bake
            --context=.
            --source=${{ matrix.cell.source }}
            --tier=${{ matrix.cell.tier }}
            --release-tag=${{ inputs.release-tag }}
            --repo-id=${{ inputs.repo-id }}
            --allow-prod=${{ inputs.allow-prod }}
            --hf-token=env:HF_TOKEN
            --limit=${{ inputs.limit }}
            --offset=${{ inputs.offset }}
            --batch-size=${{ inputs.batch-size }}
            --batch-max-bytes=${{ inputs.batch-max-bytes }}
            ${{ inputs.dry-run == true && '--dry-run=true' || '' }}

      # ADR-0011 / mat-vis#152 phase-c: lock the Layer-2 upstream mirror
      # against silent schema drift. The baker just pushed the candidate
      # <source>.json to HF at release-tag; fetch it and diff against the
      # previous release. See scripts/check_upstream_schema_drift.py.
      # Skipped on dry-run (nothing was pushed to HF).
      - name: Upstream schema-drift gate (#152)
        if: inputs.dry-run != true
        run: |
          uv run python scripts/check_upstream_schema_drift.py \
            --source "${{ matrix.cell.source }}" \
            --candidate "https://huggingface.co/datasets/${{ inputs.repo-id }}/resolve/${{ inputs.release-tag }}/${{ matrix.cell.source }}.json"

      # mat-vis#295: per-material upstream.raw equality vs the previous
      # release on HF. Catches silent upstream content edits that
      # schema-drift is structurally blind to (keys stay the same, values
      # change). Free pass on first cut (no previous catalog).
      - name: Resolve previous release tag (for content-drift gate)
        id: prev_for_drift
        if: inputs.dry-run != true
        env:
          CURRENT_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          prev=$(git tag --list 'v*' --sort=-v:refname \
            | awk -v cur="$CURRENT_TAG" '$0 < cur { print; exit }')
          echo "previous_tag=${prev}" >>"${GITHUB_OUTPUT}"
          echo "previous tag: ${prev:-<none>}"

      - name: Upstream content-drift gate (#295)
        if: inputs.dry-run != true && steps.prev_for_drift.outputs.previous_tag != ''
        env:
          REPO_ID: ${{ inputs.repo-id }}
          CURRENT_TAG: ${{ inputs.release-tag }}
          PREVIOUS_TAG: ${{ steps.prev_for_drift.outputs.previous_tag }}
          SRC: ${{ matrix.cell.source }}
        run: |
          set -euo pipefail
          waiver_arg=()
          if [ -f .github/content-drift-waivers.yaml ]; then
            waiver_arg+=(--waivers .github/content-drift-waivers.yaml)
          fi
          uv run --with pyyaml python scripts/check_upstream_content_drift.py \
            --source "${SRC}" \
            --candidate "https://huggingface.co/datasets/${REPO_ID}/resolve/${CURRENT_TAG}/${SRC}.json" \
            --previous  "https://huggingface.co/datasets/${REPO_ID}/resolve/${PREVIOUS_TAG}/${SRC}.json" \
            "${waiver_arg[@]}"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-on-failure
        with:
          label-prefix: "[bake-failed]"
          workflow-name: "bake"
          target: "${{ matrix.cell.source }}/${{ matrix.cell.tier }} @ ${{ inputs.release-tag }}"
          context: >-
            Likely causes: upstream API transient (rate-limit or 5xx),
            runner disk filled during fetch, or HF push auth/size error.
            Check the hf-bake step logs. Atomic HF commits mean a failed
            bake leaves the target revision unchanged — safe to retry.

  # #263 phase C: post-bake gate. Runs validate_release.py against the
  # live HF substrate. Catches the v2026.04.0 class of regression by
  # comparing the just-baked release-tag against the previous CalVer
  # tag. Hard-fails the workflow on >5% drop or cross-tier parity skew >20%.
  validate:
    name: validate-release ${{ inputs.release-tag }}
    needs: bake
    if: inputs.dry-run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need git tag history for previous-tag lookup

      - name: Resolve previous release tag
        id: prev
        env:
          CURRENT_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          # Newest v* tag strictly less than the current bake's release-tag.
          # Empty result is fine — first-ever release has nothing to regress
          # against, and validate_release.py treats the empty case as clean.
          prev=$(git tag --list 'v*' --sort=-v:refname \
            | awk -v cur="$CURRENT_TAG" '$0 < cur { print; exit }')
          echo "previous_tag=${prev}" >>"${GITHUB_OUTPUT}"
          echo "previous tag: ${prev:-<none>}"

      # mat-vis#273: validate_release moved into a Dagger function
      # for parity with bake/derive/test_e2e. Same primitive used by
      # release-validate.yml's cron + dispatch — single place to
      # evolve the validator's contract.
      - name: Validate per-file substrate against HF
        uses: ./.github/actions/dagger-call
        with:
          args: >-
            validate-release
            --context=.
            --release-tag=${{ inputs.release-tag }}
            --repo-id=${{ inputs.repo-id }}
            --hf-token=env:HF_TOKEN
            --previous-tag=${{ steps.prev.outputs.previous_tag }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-on-failure
        with:
          label-prefix: "[validate-failed]"
          workflow-name: "bake-post-gate"
          target: "${{ inputs.release-tag }}"
          context: >-
            Post-bake validator tripped on the live HF substrate.
            Likely causes: a (source, tier) regressed > 5% vs the
            previous release (the v2026.04.0 gpuopen-1k-2234-to-10
            class), or a tier within this release dropped below 80%
            of its source's leader. Inspect the validate-release step
            log for the offending pair. The bake itself succeeded —
            this gate runs against the resulting HF state.
