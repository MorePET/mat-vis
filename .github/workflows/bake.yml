---
# Bake workflow — atomic HF push per (source, tier) per ADR-0007.

name: Bake

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to bake'
        required: true
        default: 'ambientcg'
        type: choice
        options:
          - ambientcg
          - polyhaven
          - gpuopen
          - physicallybased
      tier:
        description: 'Resolution tier (scalar for physicallybased)'
        required: true
        default: '1k'
        type: choice
        options:
          - 128
          - 256
          - 512
          - 1k
          - 2k
          - 4k
          - 8k
          - scalar
      limit:
        description: 'Max materials (0 = all)'
        required: false
        default: '0'
        type: string
      offset:
        description: 'Skip first N materials'
        required: false
        default: '0'
        type: string
      batch-size:
        description: 'Materials per streaming batch'
        required: false
        default: '50'
        type: string
      release-tag:
        description: 'Calver data release tag (e.g. v2026.04.1)'
        required: true
        default: 'v2026.04.1'
        type: string
      dry-run:
        description: 'Bake to local tar; skip the HF push'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write          # needed by notify-on-failure composite action

jobs:
  bake:
    name: hf-bake ${{ inputs.source }} ${{ inputs.tier }}
    runs-on: ubuntu-latest
    # GH-hosted runners hard-cap at 360 min; 350 leaves headroom for
    # the post-step log upload and any slack in the scheduler.
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install baker
        run: uv sync --all-extras

      - name: hf-bake
        run: |
          set -euxo pipefail
          limit_flag=""
          if [ "${{ inputs.limit }}" != "0" ]; then
            limit_flag="--limit ${{ inputs.limit }}"
          fi
          offset_flag=""
          if [ "${{ inputs.offset }}" != "0" ]; then
            offset_flag="--offset ${{ inputs.offset }}"
          fi
          dry_flag=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            dry_flag="--dry-run"
          fi
          uv run mat-vis-baker hf-bake \
            "${{ inputs.source }}" \
            "${{ inputs.tier }}" \
            /tmp/bake \
            --release-tag "${{ inputs.release-tag }}" \
            --batch-size "${{ inputs.batch-size }}" \
            $limit_flag $offset_flag $dry_flag

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-on-failure
        with:
          label-prefix: "[bake-failed]"
          workflow-name: "bake"
          target: "${{ inputs.source }}/${{ inputs.tier }} @ ${{ inputs.release-tag }}"
          context: >-
            Likely causes: upstream API transient (rate-limit or 5xx),
            runner disk filled during fetch, or HF push auth/size error.
            Check the hf-bake step logs. Atomic HF commits mean a failed
            bake leaves the target revision unchanged — safe to retry.
