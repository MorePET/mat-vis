---
# Bake workflow — atomic HF push per (source, tier) per ADR-0007.
#
# Invokes the Dagger `bake` function (#136) which wraps
# mat-vis-baker hf-bake in a python:3.12-slim container. Container
# bootstraps inside Dagger — no separate install steps here.
# Reproduce locally with: dagger call bake --source=... --tier=1k ...

name: Bake

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to bake'
        required: true
        default: 'ambientcg'
        type: choice
        options:
          - ambientcg
          - polyhaven
          - gpuopen
          - physicallybased
      tier:
        description: 'Resolution tier (scalar for physicallybased)'
        required: true
        default: '1k'
        type: choice
        options:
          - 128
          - 256
          - 512
          - 1k
          - 2k
          - 4k
          - 8k
          - scalar
      limit:
        description: 'Max materials (0 = all)'
        required: false
        default: '0'
        type: string
      offset:
        description: 'Skip first N materials'
        required: false
        default: '0'
        type: string
      batch-size:
        description: 'Materials per streaming batch'
        required: false
        default: '50'
        type: string
      release-tag:
        description: 'Calver data release tag (e.g. v2026.04.1)'
        required: true
        default: 'v2026.04.1'
        type: string
      dry-run:
        description: 'Bake to local tar; skip the HF push'
        required: false
        default: false
        type: boolean
      repo-id:
        description: 'HF dataset repo'
        required: false
        default: 'gerchowl/mat-vis-tst'
        type: string
      allow-prod:
        description: 'Required to target any non-*-tst HF repo (e.g. gerchowl/mat-vis)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write          # needed by notify-on-failure composite action

# Serialise dispatches on (repo, release, source, tier). Two parallel
# dispatches against the same target tier would race on the catalog +
# release-manifest commits — order is observable to clients.
concurrency:
  group: >-
    bake-${{ inputs.repo-id }}-${{ inputs.release-tag }}-${{ inputs.source }}-${{ inputs.tier }}
  cancel-in-progress: false

jobs:
  bake:
    name: hf-bake ${{ inputs.source }} ${{ inputs.tier }}
    runs-on: ubuntu-latest
    # GH-hosted runners hard-cap at 360 min; 350 leaves headroom for
    # the post-step log upload and any slack in the scheduler.
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Dagger shell-safety lint (#61)
        run: python3 scripts/check-dagger-shell-safety.py

      - name: hf-bake
        uses: dagger/dagger-for-github@v8.4.1
        with:
          verb: call
          module: .dagger
          # Dagger fn sentinels: limit=0 (no cap), offset=0 (no skip),
          # shard-index/total=-1 (unsharded). The baker CLI adopts the
          # same sentinel convention so re-plumbing is a pure rename.
          args: >-
            bake
            --context=.
            --source=${{ inputs.source }}
            --tier=${{ inputs.tier }}
            --release-tag=${{ inputs.release-tag }}
            --repo-id=${{ inputs.repo-id }}
            --allow-prod=${{ inputs.allow-prod }}
            --hf-token=env:HF_TOKEN
            --limit=${{ inputs.limit }}
            --offset=${{ inputs.offset }}
            --batch-size=${{ inputs.batch-size }}
            ${{ inputs.dry-run == true && '--dry-run=true' || '' }}

      # ADR-0011 / mat-vis#152 phase-c: lock the Layer-2 upstream mirror
      # against silent schema drift. The baker just pushed the candidate
      # <source>.json to HF at release-tag; fetch it and diff against the
      # previous release. See scripts/check_upstream_schema_drift.py.
      # Skipped on dry-run (nothing was pushed to HF).
      - name: Upstream schema-drift gate (#152)
        if: inputs.dry-run != true
        run: |
          uv run python scripts/check_upstream_schema_drift.py \
            --source "${{ inputs.source }}" \
            --candidate "https://huggingface.co/datasets/${{ inputs.repo-id }}/resolve/${{ inputs.release-tag }}/${{ inputs.source }}.json"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-on-failure
        with:
          label-prefix: "[bake-failed]"
          workflow-name: "bake"
          target: "${{ inputs.source }}/${{ inputs.tier }} @ ${{ inputs.release-tag }}"
          context: >-
            Likely causes: upstream API transient (rate-limit or 5xx),
            runner disk filled during fetch, or HF push auth/size error.
            Check the hf-bake step logs. Atomic HF commits mean a failed
            bake leaves the target revision unchanged — safe to retry.
