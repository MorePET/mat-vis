name: CI

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    tags: ["v*"]

# #262: Dagger ships traces + metrics to dagger.cloud by default.
# That collector flakes (5xx) and the metric exporter then SIGPIPEs
# the dagger CLI (exit 141), bricking otherwise-green CI runs (e.g.
# the v0.6.0 tag run 25287958789). Until #262 lands a self-hosted
# OTLP collector + wires it via .github/actions/otlp-tailnet, fully
# disable the OTel SDK in CI. DAGGER_NO_NAG silences the cosmetic
# "Setup tracing at dagger.cloud" line.
env:
  OTEL_SDK_DISABLED: "true"
  DAGGER_NO_NAG: "1"

jobs:
  ci:
    name: Lint + Test + Container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dagger shell-safety lint (#61)
        run: python3 scripts/check-dagger-shell-safety.py
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          verb: call
          module: .dagger
          args: test-all --src=.

  integration:
    name: Integration test (real upstream data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          verb: call
          module: .dagger
          args: integration-test --src=.

  client-tests:
    name: Client tests (all languages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          verb: call
          module: .dagger
          # live=true exports MAT_VIS_LIVE_TESTS=1 + MAT_VIS_LIVE_TAG=<tag>
          # in each language container so the @live / liveDescribe blocks
          # (incl. the #248 manifest-driven coverage matrix) actually run
          # against prod HF, not the structural-only stubs.
          args: test-clients --src=. --tag=v2026.04.2 --live=true

  # validate-release lives in promote-data-release.yml (pre-promotion gate)
  # and release-validate.yml (daily drift check). It tests the state of a
  # published GitHub Release, not the code in this PR, so it does not
  # belong on the PR merge gate — see #80.

  push:
    name: Push baker image to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, integration, client-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          verb: call
          module: .dagger
          args: >-
            push --src=.
            --tag=${{ github.ref_name }}
            --registry-user=${{ github.actor }}
            --registry-pass=env:GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
